name: flags2env consumer compliance

on:
  pull_request:
    paths:
      - .cli-flags.toml
      - build.rs
      - vendor/flags2env/**
      - src/broker_runtime_config.rs
      - .github/scripts/flags2env-runtime-smoke.sh
      - .github/workflows/flags2env-compliance.yml
  push:
    branches: [main]
    paths:
      - .cli-flags.toml
      - build.rs
      - vendor/flags2env/**
      - src/broker_runtime_config.rs
      - .github/scripts/flags2env-runtime-smoke.sh
      - .github/workflows/flags2env-compliance.yml

permissions:
  contents: read

jobs:
  compliance:
    uses: ORESoftware/flags-2-env/.github/workflows/reusable-consumer-compliance.yml@b596f2d1c99bd726b262a923916e3015bc80bc37
    with:
      tooling_ref: b596f2d1c99bd726b262a923916e3015bc80bc37
      parser_ref: b596f2d1c99bd726b262a923916e3015bc80bc37
      kind: server
      command_name: lmxd
      contract_path: .cli-flags.toml
      runtime_smoke_script: .github/scripts/flags2env-runtime-smoke.sh
