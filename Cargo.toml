[package]
name = "live_mutex_mills"
version = "0.1.0"
edition = "2021"
description = "A leaderless quorum/vote distributed mutual-exclusion protocol — a Paxos/Raft alternative specialized for locking."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
# OS CSPRNG for unguessable client holder tokens (a sequential counter let any
# client release another client's lock on the same node by guessing the id).
getrandom = "0.2"

[build-dependencies]
cc = "1"

[[example]]
name = "contention"
path = "examples/contention.rs"
